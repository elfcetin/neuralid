services:
  postgres:
      image: postgres:17
      container_name: neuralid-db
      environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      ports:
        - "5432:5432"
      volumes:
        - neuralid-data:/var/lib/postgresql/data

volumes:
  neuralid-data:
        
        